<div class="text-lingol-ink font-sans min-h-screen overflow-x-hidden flex flex-col justify-between">
  <header class="px-4 sm:px-8 py-5 flex justify-between items-center gap-4 max-w-[80rem] mx-auto w-full">
    <a class="flex items-center gap-3 cursor-pointer select-none"
       [routerLink]="auth.ehProfessor() ? '/professor' : '/'">
      <img src="img/logo-lingol.png" alt="" aria-hidden="true" class="h-9 sm:h-11 w-auto">
      <span class="font-black text-2xl sm:text-[2.1rem] leading-none tracking-tight text-lingol-ink">LINGOL</span>
    </a>

    @if (auth.usuario(); as usuario) {
      <div class="flex items-center gap-4 sm:gap-6 bg-white rounded-full pl-5 sm:pl-8 pr-4 sm:pr-6 py-3
                  shadow-[0_6px_24px_-8px_rgba(15,23,42,0.22)]">
        <div class="text-right leading-tight min-w-0">
          <p class="font-bold text-sm sm:text-[1.15rem] text-lingol-ink truncate max-w-[9rem] sm:max-w-none">{{ usuario.nome }}</p>
          <p class="text-[11px] sm:text-sm uppercase tracking-wide text-slate-500 whitespace-nowrap">{{ usuario.papel }}</p>
        </div>
        <button (click)="auth.sair()" title="Sair" aria-label="Sair"
                class="text-xl sm:text-[1.6rem] text-lingol-ink hover:text-lingol-primary transition-colors">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>
    }
  </header>

  <main class="flex-1 max-w-6xl mx-auto w-full px-4 py-8 flex flex-col">
    <router-outlet></router-outlet>
  </main>

  <footer class="text-center py-7 px-4 text-[0.95rem] font-medium text-slate-500">
    Lingol · EdTech de Aprendizagem Imersiva · .NET 9 + Angular 19
  </footer>
</div>
