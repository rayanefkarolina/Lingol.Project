<section class="animate-fade-in flex-1 flex items-center justify-center">

  <div class="w-full max-w-[33rem] rounded-[2rem] border-2 border-lingol-ink bg-white px-8 py-9 sm:px-10
              text-center shadow-[0_26px_60px_-24px_rgba(15,23,42,0.55)]">

    <span class="inline-block rounded-full bg-slate-100 px-6 py-2 text-base sm:text-lg text-slate-500">
      Jornada do Aluno
    </span>

    <h1 class="mt-4 text-[clamp(2rem,5vw,2.6rem)] font-black tracking-tight text-lingol-ink">
      Sala de Missões
    </h1>

    <label for="matricula" class="mt-8 block text-[0.95rem] font-bold text-lingol-ink">
      Digite o Código da Missão (Enviado pelo Professor)
    </label>

    <!-- No celular o campo e o botão empilham para o número não ficar espremido -->
    <div class="mt-3 flex flex-col sm:flex-row items-stretch sm:items-center gap-2
                rounded-2xl sm:rounded-full border-2 border-[#8b7bd8] bg-white p-2 sm:p-1.5 sm:pl-6
                focus-within:border-lingol-primary transition-colors">
      <input id="matricula" type="text" inputmode="numeric"
             [(ngModel)]="credenciais.matricula" (keyup.enter)="fazerLogin()"
             placeholder="ex: 2026001"
             class="min-w-0 flex-1 bg-transparent px-3 py-2 sm:px-0 sm:py-0 text-center sm:text-left
                    text-lg sm:text-xl text-lingol-ink placeholder:text-slate-400 focus:outline-none">

      <button (click)="fazerLogin()" [disabled]="carregando()"
              class="shrink-0 rounded-xl sm:rounded-full bg-[#0f2f7d] px-5 sm:px-7 py-3 text-base sm:text-lg
                     font-bold text-white transition-all hover:brightness-110 disabled:opacity-70">
        @if (carregando()) {
          <i class="fa-solid fa-circle-notch animate-spin"></i> Entrando...
        } @else {
          Entrar na Missão
        }
      </button>
    </div>

    @if (mensagemErro()) {
      <p class="mt-4 text-sm font-bold text-red-600">{{ mensagemErro() }}</p>
    }
  </div>
</section>
